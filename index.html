<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StoryMotion AI</title>
<meta name="theme-color" content="#14122a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StoryMotion">
<style>
  :root{--bg:#14122a;--card:#1f1c3d;--line:#34306a;--txt:#f2f0ff;--mut:#a9a4d6;--acc:#ff5fa2;--acc2:#8a6bff;--ok:#3ddc97;--err:#ff6b6b;--warn:#ffc857}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
  .wrap{max-width:560px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
  .logo{font-weight:800;font-size:20px;letter-spacing:-.3px}
  .logo span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .credits{font-size:14px;color:var(--mut);text-align:right}
  .credits b{color:var(--txt);font-size:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
  h2{margin:0 0 12px;font-size:18px}
  label{display:block;font-size:14px;color:var(--mut);margin:12px 0 6px}
  input,textarea,select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#15132d;color:var(--txt);font:inherit;font-size:16px}
  textarea{min-height:120px;resize:vertical}
  input[type=color]{padding:4px;height:48px}
  .row{display:flex;gap:10px}.row>*{flex:1}
  button{appearance:none;border:0;border-radius:12px;padding:14px 16px;font:inherit;font-weight:700;cursor:pointer;width:100%;margin-top:16px;color:#fff;background:linear-gradient(90deg,var(--acc),var(--acc2))}
  button:disabled{opacity:.5}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:600}
  .link{background:none;color:var(--mut);text-decoration:underline;font-weight:400;padding:6px;margin-top:8px;width:auto}
  .msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px;display:none}
  .msg.show{display:block}.msg.err{background:#3a1d2a;color:#ffc4c4}.msg.ok{background:#173a2d;color:#b9f5d8}
  .hint{font-size:13px;color:var(--mut);margin-top:4px}
  .job{border-top:1px solid var(--line);padding:14px 0}.job:first-child{border-top:0;padding-top:0}
  .job .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .job .req{font-size:14px;color:var(--mut);margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .badge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap}
  .b-run{background:#3a3270;color:#d7ceff}.b-done{background:#173a2d;color:var(--ok)}.b-fail{background:#3a1d2a;color:var(--err)}
  .bar{height:6px;background:#2a2656;border-radius:99px;margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s}
  video{width:100%;border-radius:12px;margin-top:10px;background:#000;max-height:70vh}
  .acts{display:flex;gap:8px}.acts button{margin-top:10px;padding:10px;font-size:14px}
  .hidden{display:none!important}
  .tabs{display:flex;gap:6px;margin-bottom:6px}.tabs button{margin:0;padding:10px;font-size:15px}
  .tabs button:not(.on){background:transparent;border:1px solid var(--line);color:var(--mut)}
  .empty{color:var(--mut);font-size:14px}
  .install{font-size:13px;color:var(--mut);text-align:center;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Story<span>Motion</span> AI</div>
    <div class="credits hidden" id="hdr"><div>Kredity: <b id="credits">–</b></div><button class="link" id="logout">Odhlásit</button></div>
  </header>

  <!-- PŘIHLÁŠENÍ -->
  <section id="v-auth" class="card hidden">
    <div class="tabs"><button id="t-in" class="on">Přihlásit</button><button id="t-up">Registrace</button></div>
    <form id="f-auth">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="pass">Heslo</label>
      <input id="pass" type="password" autocomplete="current-password" minlength="8" maxlength="48" required>
      <div class="hint">8–48 znaků</div>
      <button id="b-auth" type="submit">Přihlásit se</button>
    </form>
    <button class="link" id="forgot">Zapomněl jsem heslo</button>
    <div class="msg" id="m-auth"></div>
  </section>

  <!-- NOVÉ HESLO -->
  <section id="v-reset" class="card hidden">
    <h2>Nastavit nové heslo</h2>
    <form id="f-reset">
      <label for="newpass">Nové heslo</label>
      <input id="newpass" type="password" autocomplete="new-password" minlength="8" maxlength="48" required>
      <button type="submit">Uložit heslo</button>
    </form>
    <div class="msg" id="m-reset"></div>
  </section>

  <!-- APLIKACE -->
  <section id="v-app" class="hidden">
    <div class="card">
      <h2>Nové video</h2>
      <form id="f-job">
        <label for="request">Co má video ukazovat?</label>
        <textarea id="request" minlength="10" maxlength="2000" required placeholder="Např.: Krátké veselé video o čištění střechy dronem, před a po, na konci výzva k objednání."></textarea>
        <div class="row">
          <button type="button" class="ghost hidden" id="mic">🎤 Nadiktovat</button>
        </div>
        <label for="company">Název firmy / značky</label>
        <input id="company" maxlength="120" required autocomplete="organization">
        <label for="contact">Kontakt na konci videa (nepovinné)</label>
        <input id="contact" maxlength="200" placeholder="tel., web nebo e-mail">
        <div class="row">
          <div>
            <label for="voice">Hlas</label>
            <select id="voice">
              <option value="auto">Automaticky</option>
              <option value="Homme, calme">Muž, klidný</option>
              <option value="Homme, énergique">Muž, energický</option>
              <option value="Femme, douce">Žena, jemná</option>
              <option value="Femme, claire">Žena, jasná</option>
            </select>
          </div>
          <div>
            <label for="color">Barva značky</label>
            <input id="color" type="color" value="#FF5FA2">
          </div>
        </div>
        <button id="b-job" type="submit">Vytvořit video (1 kredit)</button>
      </form>
      <div class="msg" id="m-job"></div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Moje videa</h2><button class="link" id="refresh" style="margin:0">Obnovit</button></div>
      <div id="jobs" style="margin-top:12px"><div class="empty">Načítám…</div></div>
    </div>
    <div class="install" id="install">Tip: přidejte si aplikaci na plochu telefonu – v Safari tlačítko <b>Sdílet</b> → <b>Přidat na plochu</b>.</div>
  </section>
</div>

<script>
const SB_URL = 'https://ycqcrmetfndcwmnflmch.supabase.co';
const SB_KEY = 'sb_publishable_a9KCY0N5OxYZefYoKYZnJQ_wRfhIinc';
const BUCKET = 'videos';
const APP_URL = location.origin + location.pathname;
const $ = id => document.getElementById(id);

/* ---------- úložiště relace ---------- */
const store = {
  get(){ try { return JSON.parse(localStorage.getItem('sm_session')||'null'); } catch(e){ return null; } },
  set(s){ try { s ? localStorage.setItem('sm_session', JSON.stringify(s)) : localStorage.removeItem('sm_session'); } catch(e){} mem = s; },
};
let mem = store.get();
let mode = 'in';
let pollTimer = null;

function msg(el, text, ok){ const m=$(el); m.textContent=text||''; m.className='msg'+(text?' show '+(ok?'ok':'err'):''); }
function show(view){ ['v-auth','v-reset','v-app'].forEach(v=>$(v).classList.toggle('hidden', v!==view)); $('hdr').classList.toggle('hidden', view!=='v-app'); }

/* ---------- Supabase REST ---------- */
async function authReq(path, body, method='POST', token){
  const r = await fetch(SB_URL+'/auth/v1/'+path, {method, headers:{'apikey':SB_KEY,'Content-Type':'application/json', ...(token?{'Authorization':'Bearer '+token}:{})}, body: body?JSON.stringify(body):undefined});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.msg || j.error_description || j.message || j.error || ('HTTP '+r.status));
  return j;
}
function saveSession(j){ store.set({access_token:j.access_token, refresh_token:j.refresh_token, expires_at: j.expires_at || (Math.floor(Date.now()/1000) + (j.expires_in||3600)), email: j.user?.email || mem?.email}); }
async function token(){
  if(!mem) throw new Error('not_authenticated');
  if(mem.expires_at - 60 < Date.now()/1000){
    try { saveSession(await authReq('token?grant_type=refresh_token', {refresh_token: mem.refresh_token})); }
    catch(e){ store.set(null); show('v-auth'); throw new Error('not_authenticated'); }
  }
  return mem.access_token;
}
async function api(path, opts={}){
  const t = await token();
  const r = await fetch(SB_URL+path, {...opts, headers:{'apikey':SB_KEY,'Authorization':'Bearer '+t,'Content-Type':'application/json', ...(opts.headers||{})}});
  const j = await r.json().catch(()=>null);
  if(r.status===401){ store.set(null); show('v-auth'); throw new Error('not_authenticated'); }
  if(!r.ok) throw new Error((j && (j.message||j.error)) || ('HTTP '+r.status));
  return j;
}

/* ---------- přihlášení ---------- */
function setMode(m){ mode=m; $('t-in').classList.toggle('on',m==='in'); $('t-up').classList.toggle('on',m==='up'); $('b-auth').textContent = m==='in'?'Přihlásit se':'Vytvořit účet'; $('pass').autocomplete = m==='in'?'current-password':'new-password'; msg('m-auth'); }
$('t-in').onclick=()=>setMode('in'); $('t-up').onclick=()=>setMode('up');
const AUTH_ERR = {
  'Invalid login credentials':'Nesprávný e-mail nebo heslo.',
  'Email not confirmed':'E-mail ještě není potvrzený – klikněte na odkaz v e-mailu od nás.',
  'User already registered':'Tento e-mail už je zaregistrovaný – přihlaste se.',
};
$('f-auth').onsubmit = async e => {
  e.preventDefault(); const b=$('b-auth'); b.disabled=true; msg('m-auth');
  const email=$('email').value.trim(), password=$('pass').value;
  try{
    if(mode==='in'){
      saveSession(await authReq('token?grant_type=password', {email, password})); start();
    } else {
      const j = await authReq('signup?redirect_to='+encodeURIComponent(APP_URL), {email, password});
      if(j.access_token){ saveSession(j); start(); }
      else msg('m-auth','Hotovo! Poslali jsme vám e-mail – klikněte na odkaz v něm a pak se přihlaste.', true);
    }
  }catch(err){ msg('m-auth', AUTH_ERR[err.message] || err.message); }
  b.disabled=false;
};
$('forgot').onclick = async () => {
  const email=$('email').value.trim(); if(!email){ msg('m-auth','Nejdřív vyplňte e-mail.'); return; }
  try{ await authReq('recover?redirect_to='+encodeURIComponent(APP_URL), {email}); msg('m-auth','Poslali jsme vám e-mail s odkazem na nové heslo.', true); }
  catch(err){ msg('m-auth', err.message); }
};
$('f-reset').onsubmit = async e => {
  e.preventDefault();
  try{ await authReq('user', {password:$('newpass').value}, 'PUT', await token()); msg('m-reset','Heslo uloženo.', true); setTimeout(start, 800); }
  catch(err){ msg('m-reset', err.message); }
};
$('logout').onclick = async () => { try{ await authReq('logout', null, 'POST', mem?.access_token); }catch(e){} store.set(null); clearInterval(pollTimer); show('v-auth'); };

/* návrat z e-mailu (potvrzení / obnova hesla) */
function readHash(){
  if(!location.hash.includes('access_token')) { if(location.hash.includes('error_description')){ const p=new URLSearchParams(location.hash.slice(1)); setTimeout(()=>msg('m-auth', p.get('error_description')),0); history.replaceState(null,'',APP_URL);} return null; }
  const p = new URLSearchParams(location.hash.slice(1));
  saveSession({access_token:p.get('access_token'), refresh_token:p.get('refresh_token'), expires_in:+p.get('expires_in')||3600, expires_at:+p.get('expires_at')||undefined});
  history.replaceState(null,'',APP_URL);
  return p.get('type');
}

/* ---------- videa ---------- */
const STEP = {queued:['Ve frontě',5], brief:['Připravuji zadání',12], scenario:['Píšu scénář',25], images:['Kreslím obrázky',50], render:['Skládám video',75], upload:['Ukládám video',92], done:['Hotovo',100]};
const JOB_ERR = {
  insufficient_credits:'Nemáte žádný kredit.', no_credits:'Nemáte žádný kredit.',
  too_many_active_jobs:'Už se vyrábějí 2 videa – počkejte, až se dokončí.',
  invalid_request:'Popis videa musí mít 10 až 2000 znaků.', request_too_short:'Popis videa je moc krátký (min. 10 znaků).',
  invalid_company:'Vyplňte název firmy (max. 120 znaků).', no_profile:'Účet není dokončený – odhlaste se a přihlaste znovu.',
  not_authenticated:'Přihlaste se prosím znovu.'
};
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const urlCache = {};
async function videoUrl(path){
  const c = urlCache[path]; if(c && c.exp > Date.now()) return c.url;
  const j = await api('/storage/v1/object/sign/'+BUCKET+'/'+path.split('/').map(encodeURIComponent).join('/'), {method:'POST', body:JSON.stringify({expiresIn:3600})});
  const url = SB_URL + '/storage/v1' + (j.signedURL || j.signedUrl);
  urlCache[path] = {url, exp: Date.now()+50*60*1000}; return url;
}
async function loadCredits(){ try{ const p = await api('/rest/v1/profiles?select=credits'); $('credits').textContent = p?.[0]?.credits ?? 0; }catch(e){} }
let lastSig = '';
async function loadJobs(){
  let jobs;
  try{ jobs = await api('/rest/v1/video_jobs?select=id,status,progress,error,request,company,video_path,title,caption,duration_s,created_at,credit_refunded&order=created_at.desc&limit=30'); }
  catch(e){ return; }
  const sig = JSON.stringify(jobs); if(sig===lastSig) return; lastSig = sig;
  const box = $('jobs');
  if(!jobs.length){ box.innerHTML = '<div class="empty">Zatím žádná videa. Vytvořte první nahoře.</div>'; return; }
  box.innerHTML = jobs.map(j=>{
    const run = j.status==='queued'||j.status==='processing';
    const st = STEP[j.progress] || STEP.queued;
    const badge = j.status==='done' ? '<span class="badge b-done">Hotovo</span>' : run ? '<span class="badge b-run">'+esc(st[0])+'</span>' : '<span class="badge b-fail">'+(j.status==='rejected'?'Zamítnuto':'Nepovedlo se')+'</span>';
    const when = new Date(j.created_at).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'});
    let body = '';
    if(run) body = '<div class="bar"><i style="width:'+st[1]+'%"></i></div><div class="hint">Výroba trvá obvykle 2–5 minut. Stránku můžete zavřít.</div>';
    if(j.status==='done' && j.video_path) body = '<video controls playsinline preload="metadata" data-path="'+esc(j.video_path)+'"></video><div class="acts"><button class="ghost" data-dl="'+esc(j.video_path)+'">Stáhnout</button><button class="ghost" data-share="'+esc(j.video_path)+'" data-title="'+esc(j.title||'Video')+'">Sdílet</button></div>'+(j.caption?'<div class="hint" style="margin-top:8px">'+esc(j.caption)+'</div>':'');
    if(!run && j.status!=='done') body = '<div class="hint">'+(j.status==='rejected'?'Zadání nebylo možné zpracovat (obsah).':'Výroba selhala.')+(j.credit_refunded?' Kredit byl vrácen.':'')+'</div>';
    return '<div class="job"><div class="top"><div><b>'+esc(j.title || j.company)+'</b><div class="hint">'+when+'</div></div>'+badge+'</div><div class="req">'+esc(j.request)+'</div>'+body+'</div>';
  }).join('');
  box.querySelectorAll('video[data-path]').forEach(async v=>{ try{ v.src = await videoUrl(v.dataset.path); }catch(e){} });
  box.querySelectorAll('[data-dl]').forEach(b=>b.onclick=async()=>{ const u=await videoUrl(b.dataset.dl); window.open(u+'&download=storymotion.mp4','_blank'); });
  box.querySelectorAll('[data-share]').forEach(b=>b.onclick=async()=>{
    const u=await videoUrl(b.dataset.share);
    try{
      const blob = await (await fetch(u)).blob(); const f = new File([blob],'storymotion.mp4',{type:'video/mp4'});
      if(navigator.canShare && navigator.canShare({files:[f]})) return await navigator.share({files:[f], title:b.dataset.title});
      if(navigator.share) return await navigator.share({url:u, title:b.dataset.title});
    }catch(e){ if(e.name==='AbortError') return; }
    window.open(u,'_blank');
  });
  if(jobs.some(j=>!(j.status==='queued'||j.status==='processing'))) loadCredits();
}
$('refresh').onclick = ()=>{ lastSig=''; loadJobs(); loadCredits(); };
$('f-job').onsubmit = async e => {
  e.preventDefault(); const b=$('b-job'); b.disabled=true; msg('m-job');
  try{
    await api('/rest/v1/rpc/create_video_job', {method:'POST', body:JSON.stringify({
      p_request:$('request').value.trim(), p_company:$('company').value.trim(),
      p_contact:$('contact').value.trim()||null, p_voice:$('voice').value, p_color:$('color').value.toUpperCase()
    })});
    msg('m-job','Video se vyrábí! Uvidíte ho níže, za pár minut bude hotové.', true);
    $('request').value=''; try{ localStorage.setItem('sm_company', $('company').value); localStorage.setItem('sm_contact', $('contact').value);}catch(e){}
    lastSig=''; await loadJobs(); loadCredits();
  }catch(err){ const k=Object.keys(JOB_ERR).find(k=>err.message.includes(k)); msg('m-job', k?JOB_ERR[k]:('Chyba: '+err.message)); }
  b.disabled=false;
};

/* diktování (kde to prohlížeč umí) */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SR){ const mic=$('mic'); mic.classList.remove('hidden'); let rec=null;
  mic.onclick=()=>{ if(rec){ rec.stop(); return; } rec=new SR(); rec.lang='cs-CZ'; rec.interimResults=false; rec.continuous=true;
    const base=$('request').value; mic.textContent='⏹ Zastavit';
    rec.onresult=ev=>{ let t=''; for(const r of ev.results) t+=r[0].transcript+' '; $('request').value=(base?base+' ':'')+t.trim(); };
    rec.onend=()=>{ rec=null; mic.textContent='🎤 Nadiktovat'; }; rec.onerror=()=>rec&&rec.stop(); rec.start(); };
}

/* ---------- start ---------- */
function start(){
  show('v-app');
  try{ $('company').value = localStorage.getItem('sm_company')||''; $('contact').value = localStorage.getItem('sm_contact')||''; }catch(e){}
  loadCredits(); lastSig=''; loadJobs();
  clearInterval(pollTimer); pollTimer = setInterval(()=>{ if(!document.hidden) loadJobs(); }, 6000);
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && mem) loadJobs(); });
if(navigator.standalone || matchMedia('(display-mode: standalone)').matches) $('install').classList.add('hidden');

const t = readHash();
if(t==='recovery') show('v-reset');
else if(mem) start();
else show('v-auth');
</script>
</body>
</html>
